<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Saqta Voice Router</title>

  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      color: #111827;
      background: #f3f6f5;
    }

    * { box-sizing: border-box; }

    body { margin: 0; }

    header {
      background: #0c6b49;
      color: white;
      padding: 18px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    header small { opacity: .85; }

    main {
      max-width: 1180px;
      margin: 24px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 1.25fr .75fr;
      gap: 18px;
    }

    .card {
      background: white;
      border: 1px solid #dfe7e3;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,.04);
    }

    .chat {
      min-height: 650px;
      display: flex;
      flex-direction: column;
    }

    .messages {
      padding: 20px;
      flex: 1;
      overflow: auto;
      max-height: 540px;
    }

    .msg {
      max-width: 82%;
      padding: 11px 14px;
      border-radius: 14px;
      margin: 8px 0;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .user {
      margin-left: auto;
      background: #e7f7ef;
    }

    .bot { background: #f1f3f5; }

    .controls {
      border-top: 1px solid #e5e7eb;
      padding: 14px;
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      border: 1px solid #cfd8d4;
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 11px 14px;
      cursor: pointer;
      font-weight: 600;
    }

    .send {
      background: #0c6b49;
      color: white;
    }

    .mic {
      background: #111827;
      color: white;
      min-width: 48px;
    }

    .mic.recording { background: #b42318; }

    .side { padding: 18px; }

    .side h2 {
      font-size: 16px;
      margin: 0 0 12px;
    }

    .trace {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      background: #0b1220;
      color: #d1fae5;
      padding: 14px;
      border-radius: 12px;
      white-space: pre-wrap;
      min-height: 320px;
      overflow: auto;
    }

    .badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .badge {
      background: #e7f7ef;
      color: #07583c;
      border-radius: 999px;
      padding: 5px 8px;
      font-size: 12px;
    }

    .status {
      color: #5b6470;
      font-size: 13px;
      margin-top: 10px;
    }

    .ai-note {
      font-size: 12px;
      color: #667085;
      padding: 0 18px 14px;
    }

    @media(max-width:900px) {
      main { grid-template-columns: 1fr; }
      .chat { min-height: 520px; }
    }
  </style>
</head>

<body>

<header>
  <div>
    <h1>Saqta Voice Router</h1>
    <small>LLM routing • RU / KK / mixed</small>
  </div>

  <button id="resetBtn">Новый диалог</button>
</header>

<main>

  <section class="card chat">

    <div id="messages" class="messages">
      <div class="msg bot">
        Здравствуйте! Я AI-помощник Saqta Insurance. Можете говорить или написать вопрос.
      </div>
    </div>

    <div class="controls">
      <button id="micBtn" class="mic" title="Микрофон">🎙</button>

      <input
        id="textInput"
        placeholder="Например: Кеше аварияға түстім, виновник у вас застрахован..."
      />

      <button id="sendBtn" class="send">Отправить</button>
    </div>

    <div class="ai-note">
      Голос синтезирован ИИ. В демо данные синтетические.
    </div>

  </section>

  <aside class="card side">

    <h2>Supervisor Trace</h2>

    <div id="badges" class="badges"></div>

    <div id="trace" class="trace">
      Ожидаю первую реплику…
    </div>

    <div id="status" class="status"></div>

  </aside>

</main>

<script>
  const sessionId = crypto.randomUUID();

  const messages = document.getElementById('messages');
  const textInput = document.getElementById('textInput');
  const trace = document.getElementById('trace');
  const status = document.getElementById('status');
  const badges = document.getElementById('badges');
  const micBtn = document.getElementById('micBtn');

  let recorder = null;
  let recordingBusy = false;
  let lastSttLatency = 0;
  let voiceTurnStart = 0;


  function addMessage(text, who) {
    const el = document.createElement('div');

    el.className = `msg ${who}`;
    el.textContent = text;

    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
  }


  function setTrace(data) {
    badges.innerHTML = '';

    for (const s of data.scenarios || []) {
      const b = document.createElement('span');

      b.className = 'badge';
      b.textContent =
        `${s.scenario_id} ${(s.confidence * 100).toFixed(0)}%`;

      badges.appendChild(b);
    }

    trace.textContent = JSON.stringify({
      transcript: data.transcript,
      language: data.language,
      scenarios_proposed: data.scenarios,
      accepted_scenarios: data.accepted_scenarios,
      alternatives: data.alternatives,
      reason: data.reason,
      slots: data.slots,
      handoff: data.handoff,
      latency_ms: { stt: lastSttLatency, ...data.latency_ms }
    }, null, 2);
  }


  async function speak(text, language) {
    const started = performance.now();
    try {
      const r = await fetch('/api/tts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, language })
      });

      if (!r.ok) {
        status.textContent = 'TTS недоступен — текстовый ответ сохранён';
        return null;
      }

      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      audio.onended = () => URL.revokeObjectURL(url);

      await audio.play();

      return {
        tts_first_audio: Math.round(performance.now() - started),
        voice_total: voiceTurnStart
          ? Math.round(performance.now() - voiceTurnStart)
          : 0
      };
    } catch (e) {
      console.error('TTS error:', e);
      return null;
    }
  }

  async function sendText(text, fromVoice = false) {
    if (!fromVoice) lastSttLatency = 0;
    text = text.trim();

    if (!text) return;

    addMessage(text, 'user');

    textInput.value = '';
    status.textContent = 'Маршрутизация…';

    try {
      const r = await fetch('/api/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          session_id: sessionId,
          text
        })
      });

      const data = await r.json();

      if (!r.ok) {
        addMessage(
          `Ошибка: ${data.detail || 'unknown'}`,
          'bot'
        );

        status.textContent = '';
        return;
      }

      addMessage(data.reply, 'bot');

      setTrace(data);

      status.textContent =
        `Router: ${data.latency_ms.router} ms • total: ${data.latency_ms.total} ms`;

      const ttsMetrics = await speak(
        data.reply,
        data.language === 'kk' ? 'kk' : 'ru'
      );

      if (ttsMetrics) {
        data.latency_ms = {
          stt: lastSttLatency,
          ...data.latency_ms,
          ...ttsMetrics
        };
        setTrace(data);
        status.textContent =
          `Router: ${data.latency_ms.router} ms • voice total: ${ttsMetrics.voice_total || 'n/a'} ms`;
      }

      voiceTurnStart = 0;

    } catch (e) {
      console.error('Chat error:', e);

      addMessage(
        `Ошибка сети: ${e.message}`,
        'bot'
      );

      status.textContent = '';
    }
  }


  document.getElementById('sendBtn').onclick = () => {
    sendText(textInput.value);
  };


  textInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      sendText(textInput.value);
    }
  });


  document.getElementById('resetBtn').onclick = async () => {
    try {
      await fetch(`/api/reset/${sessionId}`, {
        method: 'POST'
      });
    } catch (e) {
      console.error('Reset error:', e);
    }

    messages.innerHTML =
      '<div class="msg bot">Новый диалог. Чем помочь?</div>';

    trace.textContent =
      'Ожидаю первую реплику…';

    badges.innerHTML = '';

    status.textContent = '';
  };


  micBtn.onclick = async () => {
    if (recorder && recorder.state === 'recording') {
      voiceTurnStart = performance.now();
      recorder.stop();
      micBtn.classList.remove('recording');
      micBtn.textContent = '🎙';
      micBtn.disabled = true;
      status.textContent = 'Распознаю речь…';
      return;
    }

    if (recordingBusy) return;

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const localChunks = [];
      let mimeType = '';

      for (const candidate of [
        'audio/webm;codecs=opus',
        'audio/webm',
        'audio/ogg;codecs=opus',
        'audio/mp4'
      ]) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(candidate)) {
          mimeType = candidate;
          break;
        }
      }

      const localRecorder = mimeType
        ? new MediaRecorder(stream, { mimeType })
        : new MediaRecorder(stream);

      recorder = localRecorder;
      recordingBusy = true;

      localRecorder.ondataavailable = (event) => {
        if (event.data && event.data.size > 0) localChunks.push(event.data);
      };

      localRecorder.onerror = () => {
        stream.getTracks().forEach(track => track.stop());
        if (recorder === localRecorder) recorder = null;
        recordingBusy = false;
        micBtn.disabled = false;
        micBtn.classList.remove('recording');
        micBtn.textContent = '🎙';
        status.textContent = '';
        addMessage('Ошибка записи микрофона. Проверьте разрешение на микрофон.', 'bot');
      };

      localRecorder.onstop = async () => {
        stream.getTracks().forEach(track => track.stop());

        try {
          if (!localChunks.length) throw new Error('Аудио не было записано');

          const actualType = localRecorder.mimeType || mimeType || 'audio/webm';
          let extension = 'webm';
          if (actualType.includes('ogg')) extension = 'ogg';
          else if (actualType.includes('mp4')) extension = 'mp4';
          else if (actualType.includes('wav')) extension = 'wav';

          const blob = new Blob(localChunks, { type: actualType });
          if (blob.size < 1000) {
            throw new Error('Запись слишком короткая. Говорите 2–3 секунды.');
          }

          const formData = new FormData();
          formData.append('file', blob, `speech.${extension}`);

          const response = await fetch('/api/transcribe', {
            method: 'POST',
            body: formData
          });
          const data = await response.json();

          if (!response.ok) throw new Error(data.detail || 'STT error');
          if (!data.text || !data.text.trim()) throw new Error('Речь не распознана');

          lastSttLatency = data.latency_ms || 0;
          status.textContent = `STT: ${lastSttLatency} ms`;
          await sendText(data.text, true);
        } catch (e) {
          addMessage(`STT ошибка: ${e.message}`, 'bot');
          status.textContent = '';
        } finally {
          if (recorder === localRecorder) recorder = null;
          recordingBusy = false;
          micBtn.disabled = false;
          micBtn.classList.remove('recording');
          micBtn.textContent = '🎙';
        }
      };

      localRecorder.start(250);
      micBtn.classList.add('recording');
      micBtn.textContent = '■';
      status.textContent = 'Говорите… нажмите ещё раз для остановки';
    } catch (e) {
      recordingBusy = false;
      micBtn.disabled = false;
      micBtn.classList.remove('recording');
      micBtn.textContent = '🎙';
      status.textContent = '';
      addMessage(`Ошибка микрофона: ${e.message}`, 'bot');
    }
  };

</script>

</body>
</html>
