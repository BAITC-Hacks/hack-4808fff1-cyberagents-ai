<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Saqta Voice Router</title>

  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      color: #111827;
      background: #f3f6f5;
    }

    * { box-sizing: border-box; }

    body { margin: 0; }

    header {
      background: #0c6b49;
      color: white;
      padding: 18px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    header small { opacity: .85; }

    main {
      max-width: 1180px;
      margin: 24px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 1.25fr .75fr;
      gap: 18px;
    }

    .card {
      background: white;
      border: 1px solid #dfe7e3;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,.04);
    }

    .chat {
      min-height: 650px;
      display: flex;
      flex-direction: column;
    }

    .messages {
      padding: 20px;
      flex: 1;
      overflow: auto;
      max-height: 540px;
    }

    .msg {
      max-width: 82%;
      padding: 11px 14px;
      border-radius: 14px;
      margin: 8px 0;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .user {
      margin-left: auto;
      background: #e7f7ef;
    }

    .bot { background: #f1f3f5; }

    .controls {
      border-top: 1px solid #e5e7eb;
      padding: 14px;
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      border: 1px solid #cfd8d4;
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 11px 14px;
      cursor: pointer;
      font-weight: 600;
    }

    .send {
      background: #0c6b49;
      color: white;
    }

    .mic {
      background: #111827;
      color: white;
      min-width: 48px;
    }

    .mic.recording { background: #b42318; }

    .side { padding: 18px; }

    .side h2 {
      font-size: 16px;
      margin: 0 0 12px;
    }

    .trace {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      background: #0b1220;
      color: #d1fae5;
      padding: 14px;
      border-radius: 12px;
      white-space: pre-wrap;
      min-height: 320px;
      overflow: auto;
    }

    .badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .badge {
      background: #e7f7ef;
      color: #07583c;
      border-radius: 999px;
      padding: 5px 8px;
      font-size: 12px;
    }

    .status {
      color: #5b6470;
      font-size: 13px;
      margin-top: 10px;
    }

    .ai-note {
      font-size: 12px;
      color: #667085;
      padding: 0 18px 14px;
    }

    @media(max-width:900px) {
      main { grid-template-columns: 1fr; }
      .chat { min-height: 520px; }
    }
  </style>
</head>

<body>

<header>
  <div>
    <h1>Saqta Voice Router</h1>
    <small>LLM routing • RU / KK / mixed</small>
  </div>

  <button id="resetBtn">Новый диалог</button>
</header>

<main>

  <section class="card chat">

    <div id="messages" class="messages">
      <div class="msg bot">
        Здравствуйте! Я AI-помощник Saqta Insurance. Можете говорить или написать вопрос.
      </div>
    </div>

    <div class="controls">
      <button id="micBtn" class="mic" title="Микрофон">🎙</button>

      <input
        id="textInput"
        placeholder="Например: Кеше аварияға түстім, виновник у вас застрахован..."
      />

      <button id="sendBtn" class="send">Отправить</button>
    </div>

    <div class="ai-note">
      Голос синтезирован ИИ. В демо данные синтетические.
    </div>

  </section>

  <aside class="card side">

    <h2>Supervisor Trace</h2>

    <div id="badges" class="badges"></div>

    <div id="trace" class="trace">
      Ожидаю первую реплику…
    </div>

    <div id="status" class="status"></div>

  </aside>

</main>

<script>
  const sessionId = crypto.randomUUID();

  const messages = document.getElementById('messages');
  const textInput = document.getElementById('textInput');
  const trace = document.getElementById('trace');
  const status = document.getElementById('status');
  const badges = document.getElementById('badges');
  const micBtn = document.getElementById('micBtn');

  let recorder = null;
  let chunks = [];


  function addMessage(text, who) {
    const el = document.createElement('div');

    el.className = `msg ${who}`;
    el.textContent = text;

    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
  }


  function setTrace(data) {
    badges.innerHTML = '';

    for (const s of data.scenarios || []) {
      const b = document.createElement('span');

      b.className = 'badge';
      b.textContent =
        `${s.scenario_id} ${(s.confidence * 100).toFixed(0)}%`;

      badges.appendChild(b);
    }

    trace.textContent = JSON.stringify({
      transcript: data.transcript,
      language: data.language,
      scenarios: data.scenarios,
      alternatives: data.alternatives,
      reason: data.reason,
      slots: data.slots,
      latency_ms: data.latency_ms
    }, null, 2);
  }


  async function speak(text, language) {
    try {
      const r = await fetch('/api/tts', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          text,
          language
        })
      });

      if (!r.ok) return;

      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);

      audio.onended = () => URL.revokeObjectURL(url);

      await audio.play();

    } catch (e) {
      console.error('TTS error:', e);
    }
  }


  async function sendText(text) {
    text = text.trim();

    if (!text) return;

    addMessage(text, 'user');

    textInput.value = '';
    status.textContent = 'Маршрутизация…';

    try {
      const r = await fetch('/api/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          session_id: sessionId,
          text
        })
      });

      const data = await r.json();

      if (!r.ok) {
        addMessage(
          `Ошибка: ${data.detail || 'unknown'}`,
          'bot'
        );

        status.textContent = '';
        return;
      }

      addMessage(data.reply, 'bot');

      setTrace(data);

      status.textContent =
        `Router: ${data.latency_ms.router} ms • total: ${data.latency_ms.total} ms`;

      speak(
        data.reply,
        data.language === 'kk' ? 'kk' : 'ru'
      );

    } catch (e) {
      console.error('Chat error:', e);

      addMessage(
        `Ошибка сети: ${e.message}`,
        'bot'
      );

      status.textContent = '';
    }
  }


  document.getElementById('sendBtn').onclick = () => {
    sendText(textInput.value);
  };


  textInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      sendText(textInput.value);
    }
  });


  document.getElementById('resetBtn').onclick = async () => {
    try {
      await fetch(`/api/reset/${sessionId}`, {
        method: 'POST'
      });
    } catch (e) {
      console.error('Reset error:', e);
    }

    messages.innerHTML =
      '<div class="msg bot">Новый диалог. Чем помочь?</div>';

    trace.textContent =
      'Ожидаю первую реплику…';

    badges.innerHTML = '';

    status.textContent = '';
  };


  micBtn.onclick = async () => {

    /*
      Если запись уже идёт —
      повторное нажатие останавливает её.
    */
    if (recorder && recorder.state === 'recording') {
      recorder.stop();

      micBtn.classList.remove('recording');
      micBtn.textContent = '🎙';

      status.textContent = 'Распознаю речь…';

      return;
    }


    try {

      /*
        Получаем доступ к микрофону.
      */
      const stream =
        await navigator.mediaDevices.getUserMedia({
          audio: true
        });

      chunks = [];


      /*
        Выбираем MIME type, который реально
        поддерживает браузер пользователя.
      */
      let mimeType = '';

      if (
        window.MediaRecorder &&
        MediaRecorder.isTypeSupported(
          'audio/webm;codecs=opus'
        )
      ) {
        mimeType = 'audio/webm;codecs=opus';

      } else if (
        window.MediaRecorder &&
        MediaRecorder.isTypeSupported(
          'audio/webm'
        )
      ) {
        mimeType = 'audio/webm';

      } else if (
        window.MediaRecorder &&
        MediaRecorder.isTypeSupported(
          'audio/ogg;codecs=opus'
        )
      ) {
        mimeType = 'audio/ogg;codecs=opus';
      }


      console.log(
        'Selected MediaRecorder MIME:',
        mimeType || 'browser default'
      );


      /*
        Создаём recorder.
      */
      recorder = mimeType
        ? new MediaRecorder(
            stream,
            { mimeType }
          )
        : new MediaRecorder(stream);


      /*
        Получаем кусочки аудио.
      */
      recorder.ondataavailable = (event) => {
        if (
          event.data &&
          event.data.size > 0
        ) {
          chunks.push(event.data);
        }
      };


      recorder.onerror = (event) => {
        console.error(
          'MediaRecorder error:',
          event
        );

        stream
          .getTracks()
          .forEach(track => track.stop());

        micBtn.classList.remove('recording');
        micBtn.textContent = '🎙';

        status.textContent = '';

        addMessage(
          'Ошибка записи микрофона. Проверьте разрешение на использование микрофона.',
          'bot'
        );
      };


      /*
        После остановки записи
        собираем аудиофайл и отправляем STT.
      */
      recorder.onstop = async () => {

        stream
          .getTracks()
          .forEach(track => track.stop());


        if (!chunks.length) {
          console.error(
            'No audio chunks recorded'
          );

          addMessage(
            'STT ошибка: браузер не записал аудио. Попробуйте говорить немного дольше.',
            'bot'
          );

          status.textContent = '';

          return;
        }


        const actualType =
          recorder.mimeType ||
          mimeType ||
          'audio/webm';


        /*
          Имя файла должно соответствовать
          фактическому контейнеру.
        */
        let extension = 'webm';

        if (actualType.includes('ogg')) {
          extension = 'ogg';

        } else if (actualType.includes('mp4')) {
          extension = 'mp4';

        } else if (actualType.includes('wav')) {
          extension = 'wav';
        }


        const blob = new Blob(
          chunks,
          {
            type: actualType
          }
        );


        console.log(
          'Recorded audio:',
          {
            mimeType: actualType,
            extension: extension,
            size: blob.size,
            chunks: chunks.length
          }
        );


        /*
          Не отправляем пустую запись.
        */
        if (blob.size < 1000) {

          addMessage(
            'STT ошибка: запись получилась слишком короткой. Говорите 2–3 секунды.',
            'bot'
          );

          status.textContent = '';

          return;
        }


        const formData = new FormData();

        formData.append(
          'file',
          blob,
          `speech.${extension}`
        );


        try {

          const response =
            await fetch(
              '/api/transcribe',
              {
                method: 'POST',
                body: formData
              }
            );


          const data =
            await response.json();


          if (!response.ok) {

            console.error(
              'STT backend error:',
              data
            );

            addMessage(
              `STT ошибка: ${data.detail || 'unknown'}`,
              'bot'
            );

            status.textContent = '';

            return;
          }


          if (
            !data.text ||
            !data.text.trim()
          ) {

            addMessage(
              'Не удалось распознать речь. Попробуйте ещё раз.',
              'bot'
            );

            status.textContent = '';

            return;
          }


          status.textContent =
            `STT: ${data.latency_ms} ms`;


          sendText(data.text);


        } catch (e) {

          console.error(
            'STT request error:',
            e
          );

          addMessage(
            `STT ошибка сети: ${e.message}`,
            'bot'
          );

          status.textContent = '';
        }
      };


      /*
        Каждые 250 мс браузер отдаёт
        кусочек записи.
      */
      recorder.start(250);


      micBtn.classList.add('recording');

      micBtn.textContent = '■';

      status.textContent =
        'Говорите… нажмите ещё раз для остановки';


    } catch (e) {

      console.error(
        'Microphone error:',
        e
      );


      micBtn.classList.remove('recording');

      micBtn.textContent = '🎙';

      status.textContent = '';


      addMessage(
        `Ошибка микрофона: ${e.message}`,
        'bot'
      );
    }
  };

</script>

</body>
</html>
